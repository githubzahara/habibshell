name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev build-essential ccache
          pip install --upgrade pip
          pip install cython==0.29.36 virtualenv buildozer
      - uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
      - name: Build APK
        run: buildozer -v android debug
      - name: Sign APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ -z "$KS_B64" ]; then echo "no keystore secret, keeping debug signature"; exit 0; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/habib.keystore"
          AS=$(ls -d ~/.buildozer/android/platform/android-sdk/build-tools/*/ | sort -V | tail -1)apksigner
          for f in bin/*.apk; do
            "$AS" sign --ks "$RUNNER_TEMP/habib.keystore" --ks-key-alias habib --ks-pass env:KS_PASS --key-pass env:KS_PASS "$f"
            "$AS" verify --print-certs "$f" | head -3
          done
      - uses: actions/upload-artifact@v4
        with:
          name: habibshell-apk
          path: bin/*.apk
